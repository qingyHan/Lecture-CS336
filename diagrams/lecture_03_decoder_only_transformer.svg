<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="900" viewBox="0 0 1200 900" role="img" aria-labelledby="title desc">
  <title id="title">Decoder-only Transformer 数据流</title>
  <desc id="desc">从 token IDs 经 embedding、多个 Pre-LN Transformer blocks、final norm 和 LM head 产生 logits。每个 block 包含 causal self-attention 和 MLP，并各自带残差连接。</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#334155"/></marker>
    <style>
      .box{stroke:#334155;stroke-width:2;rx:14;ry:14}
      .label{font-family:Arial,'Noto Sans CJK SC',sans-serif;font-size:23px;fill:#0f172a;text-anchor:middle}
      .small{font-family:Arial,'Noto Sans CJK SC',sans-serif;font-size:18px;fill:#334155;text-anchor:middle}
      .arrow{fill:none;stroke:#334155;stroke-width:2.5;marker-end:url(#arrow)}
      .residual{fill:none;stroke:#64748b;stroke-width:2.2;stroke-dasharray:7 5;marker-end:url(#arrow)}
    </style>
  </defs>
  <rect width="1200" height="900" fill="#ffffff"/>
  <text x="600" y="44" class="label" style="font-size:30px;font-weight:bold">Decoder-only Transformer：前向数据流</text>
  <rect x="410" y="72" width="380" height="62" class="box" fill="#e0f2fe"/>
  <text x="600" y="110" class="label">Token IDs [B,T]</text>
  <path d="M600 134 V158" class="arrow"/>
  <rect x="410" y="160" width="380" height="72" class="box" fill="#dbeafe"/>
  <text x="600" y="190" class="label">Token Embedding</text><text x="600" y="216" class="small">+ Position Embedding → [B,T,d]</text>
  <path d="M600 232 V266" class="arrow"/>
  <rect x="240" y="268" width="720" height="360" class="box" fill="#f8fafc"/>
  <text x="600" y="300" class="label" style="font-weight:bold">Transformer Block × L（Pre-LN）</text>
  <rect x="390" y="322" width="420" height="52" class="box" fill="#ede9fe"/>
  <text x="600" y="355" class="label">LayerNorm</text>
  <path d="M600 374 V397" class="arrow"/>
  <rect x="390" y="399" width="420" height="62" class="box" fill="#c4b5fd"/>
  <text x="600" y="425" class="label">Causal Self-Attention</text><text x="600" y="449" class="small">Q,K,V · mask future positions</text>
  <path d="M600 461 V482" class="arrow"/>
  <rect x="390" y="484" width="420" height="48" class="box" fill="#fef3c7"/>
  <text x="600" y="515" class="label">Residual Add</text>
  <path d="M600 532 V550" class="arrow"/>
  <rect x="390" y="552" width="420" height="48" class="box" fill="#ede9fe"/>
  <text x="600" y="583" class="label">LayerNorm → MLP / GELU → Residual Add</text>
  <path d="M240 420 H190 V508 H390" class="residual"/>
  <text x="171" y="400" class="small">attention</text><text x="171" y="423" class="small">残差支路</text>
  <path d="M960 576 H1010 V352 H810" class="residual"/>
  <text x="1038" y="450" class="small">MLP</text><text x="1038" y="473" class="small">残差支路</text>
  <path d="M600 628 V656" class="arrow"/>
  <rect x="410" y="658" width="380" height="56" class="box" fill="#dcfce7"/>
  <text x="600" y="693" class="label">Final Norm</text>
  <path d="M600 714 V740" class="arrow"/>
  <rect x="410" y="742" width="380" height="62" class="box" fill="#bbf7d0"/>
  <text x="600" y="770" class="label">LM Head → Logits [B,T,V]</text><text x="600" y="793" class="small">训练：shifted cross-entropy；生成：取最后位置</text>
  <text x="600" y="850" class="small">示意图：不同模型在 Norm、位置编码、权重绑定和 MLP 变体上可能不同</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="860" viewBox="0 0 1280 860" role="img" aria-labelledby="title desc">
  <title id="title">CUDA/NVIDIA GPU execution and memory hierarchy</title>
  <desc id="desc">Original conceptual diagram. Left panel shows a kernel launch grid made of blocks or CTAs scheduled onto streaming multiprocessors. Right panel shows a simplified memory hierarchy from per-thread register allocation through SM-local resources, shared L2 cache and device memory/HBM. This is not a die diagram and does not depict TPU internals.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#334155"/></marker>
    <style>
      .panel{fill:#f8fafc;stroke:#cbd5e1;stroke-width:2}
      .box{stroke:#334155;stroke-width:1.8;rx:12;ry:12}
      .title{font-family:'Noto Sans CJK SC',sans-serif;font-size:27px;font-weight:bold;fill:#0f172a;text-anchor:middle}
      .label{font-family:'Noto Sans CJK SC',sans-serif;font-size:20px;fill:#0f172a;text-anchor:middle}
      .small{font-family:'Noto Sans CJK SC',sans-serif;font-size:16px;fill:#334155;text-anchor:middle}
      .arrow{fill:none;stroke:#334155;stroke-width:2.4;marker-end:url(#arrow)}
      .link{fill:none;stroke:#64748b;stroke-width:2}
    </style>
  </defs>
  <rect width="1280" height="860" fill="#ffffff"/>
  <text x="320" y="46" class="title">CUDA 执行抽象（NVIDIA GPU）</text>
  <text x="960" y="46" class="title">概念化内存层次</text>
  <rect x="35" y="74" width="570" height="710" rx="18" class="panel"/>
  <rect x="675" y="74" width="570" height="710" rx="18" class="panel"/>

  <rect x="135" y="105" width="370" height="62" class="box" fill="#dbeafe"/>
  <text x="320" y="142" class="label">Kernel launch / Grid</text>
  <text x="320" y="191" class="small">Grid 由 thread blocks / CTAs 组成</text>
  <path d="M320 202 V228" class="arrow"/>
  <rect x="100" y="230" width="440" height="75" class="box" fill="#fef3c7"/>
  <text x="320" y="260" class="label">Block / CTA</text>
  <text x="320" y="286" class="small">同一 CTA 的线程可协作并使用 shared memory</text>
  <path d="M320 305 V334" class="arrow"/>
  <rect x="85" y="336" width="470" height="260" class="box" fill="#e0f2fe"/>
  <text x="320" y="368" class="label">Streaming Multiprocessor (SM)</text>
  <rect x="120" y="389" width="400" height="52" class="box" fill="#ddd6fe"/>
  <text x="320" y="422" class="label">Warp schedulers / execution pipelines</text>
  <rect x="120" y="453" width="190" height="58" class="box" fill="#bbf7d0"/>
  <text x="215" y="477" class="small">Register file</text>
  <text x="215" y="498" class="small">按 thread 分配</text>
  <rect x="330" y="453" width="190" height="58" class="box" fill="#bbf7d0"/>
  <text x="425" y="477" class="small">Shared memory / L1</text>
  <text x="425" y="498" class="small">SM-local，关系依代际</text>
  <rect x="120" y="523" width="400" height="52" class="box" fill="#fef3c7"/>
  <text x="320" y="555" class="label">ALUs + Tensor Cores（支持的 GPU）</text>
  <path d="M320 596 V625" class="arrow"/>
  <rect x="135" y="627" width="370" height="64" class="box" fill="#e2e8f0"/>
  <text x="320" y="654" class="label">多个 SM 并行执行 CTAs</text>
  <text x="320" y="678" class="small">一个 CTA 在某一时刻由一个 SM 执行</text>
  <text x="320" y="724" class="small">Warp 通常为 32 线程：限于 NVIDIA CUDA</text>
  <text x="320" y="751" class="small">实际并发取决于寄存器/shared-memory 资源</text>

  <rect x="745" y="110" width="430" height="104" class="box" fill="#ddd6fe"/>
  <text x="960" y="145" class="label">Registers</text>
  <text x="960" y="174" class="small">逻辑上按 thread 分配；容量最紧邻计算</text>
  <text x="960" y="198" class="small">高寄存器占用可能限制 resident warps / CTAs</text>
  <path d="M960 214 V242" class="arrow"/>
  <rect x="745" y="244" width="430" height="104" class="box" fill="#bbf7d0"/>
  <text x="960" y="279" class="label">SM-local Shared Memory / L1</text>
  <text x="960" y="308" class="small">Shared memory 支持 CTA 内协作与数据复用</text>
  <text x="960" y="332" class="small">与 L1 的物理关系依 GPU 架构而异</text>
  <path d="M960 348 V376" class="arrow"/>
  <rect x="745" y="378" width="430" height="104" class="box" fill="#fef3c7"/>
  <text x="960" y="413" class="label">L2 Cache</text>
  <text x="960" y="442" class="small">通常由多个 SM 共享；具体拓扑依代际</text>
  <text x="960" y="466" class="small">复用数据可减少对 device memory 的访问</text>
  <path d="M960 482 V510" class="arrow"/>
  <rect x="745" y="512" width="430" height="104" class="box" fill="#e0f2fe"/>
  <text x="960" y="547" class="label">Device Memory / HBM</text>
  <text x="960" y="576" class="small">容量大、带宽高，但远离 SM 内部资源</text>
  <text x="960" y="600" class="small">实际流量需结合 cache 与 profiler 分析</text>
  <rect x="745" y="647" width="430" height="88" class="box" fill="#fee2e2"/>
  <text x="960" y="678" class="label">数据移动与复用决定性能</text>
  <text x="960" y="706" class="small">Roofline 是上界模型，不是精确延迟预测</text>
  <text x="960" y="760" class="small">箭头表示相对层次/成本趋势，不是严格访存路径</text>
  <text x="640" y="820" class="small">原创概念示意图；非官方 die 图。仅表达常见 CUDA/NVIDIA 抽象，不描绘 TPU 内部结构。</text>
</svg>
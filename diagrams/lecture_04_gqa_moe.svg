<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="820" viewBox="0 0 1280 820" role="img" aria-labelledby="title desc">
  <title id="title">GQA 与 Top-k MoE：数据流和成本边界</title>
  <desc id="desc">原创教学示意图。左侧 GQA 以较少的 KV heads 服务多个 query heads；右侧 MoE router 为每个 token 选择 top-k 专家。图中区分 attention score 的 query-head 维度与 KV cache 的 KV-head 维度。</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#334155"/></marker>
    <style>
      .panel{fill:#f8fafc;stroke:#cbd5e1;stroke-width:2}
      .box{stroke:#334155;stroke-width:1.8;rx:12;ry:12}
      .title{font-family:'Noto Sans CJK SC',sans-serif;font-size:28px;font-weight:bold;fill:#0f172a;text-anchor:middle}
      .label{font-family:'Noto Sans CJK SC',sans-serif;font-size:20px;fill:#0f172a;text-anchor:middle}
      .small{font-family:'Noto Sans CJK SC',sans-serif;font-size:16px;fill:#334155;text-anchor:middle}
      .arrow{fill:none;stroke:#334155;stroke-width:2.4;marker-end:url(#arrow)}
    </style>
  </defs>
  <rect width="1280" height="820" fill="#ffffff"/>
  <text x="320" y="48" class="title">GQA：共享 Key / Value heads</text>
  <text x="960" y="48" class="title">MoE：Token-choice Top-k 路由</text>
  <rect x="35" y="76" width="570" height="680" rx="18" class="panel"/>
  <rect x="675" y="76" width="570" height="680" rx="18" class="panel"/>

  <rect x="150" y="105" width="340" height="58" class="box" fill="#dbeafe"/>
  <text x="320" y="141" class="label">输入 X [B,T,d]</text>
  <path d="M320 163 V190 H190 V218" class="arrow"/>
  <path d="M320 190 H450 V218" class="arrow"/>
  <rect x="80" y="220" width="220" height="70" class="box" fill="#ddd6fe"/>
  <text x="190" y="248" class="label">Q 投影</text><text x="190" y="273" class="small">h_q 个 query heads</text>
  <rect x="340" y="220" width="220" height="70" class="box" fill="#bbf7d0"/>
  <text x="450" y="248" class="label">K / V 投影</text><text x="450" y="273" class="small">h_kv 个 KV heads</text>
  <path d="M190 290 V322 H320 V350" class="arrow"/>
  <path d="M450 290 V322 H320" class="arrow"/>
  <rect x="90" y="352" width="460" height="76" class="box" fill="#fef3c7"/>
  <text x="320" y="382" class="label">每组 Query heads 共享 K/V</text>
  <text x="320" y="407" class="small">h_q 必须能被 h_kv 整除</text>
  <path d="M320 428 V457" class="arrow"/>
  <rect x="90" y="459" width="460" height="82" class="box" fill="#e0f2fe"/>
  <text x="320" y="489" class="label">Causal Attention</text>
  <text x="320" y="515" class="small">score shape: [B,h_q,T,T]</text>
  <path d="M320 541 V570" class="arrow"/>
  <rect x="90" y="572" width="460" height="96" class="box" fill="#dcfce7"/>
  <text x="320" y="602" class="label">KV cache bytes</text>
  <text x="320" y="629" class="small">2 × L × B × T × h_kv × d_h × bytes</text>
  <text x="320" y="652" class="small">减少 KV heads → cache 近似线性下降</text>
  <text x="320" y="709" class="small">不代表所有 attention FLOPs 同比例下降</text>

  <rect x="790" y="105" width="340" height="58" class="box" fill="#dbeafe"/>
  <text x="960" y="141" class="label">Token states X</text>
  <path d="M960 163 V194" class="arrow"/>
  <rect x="810" y="196" width="300" height="70" class="box" fill="#ddd6fe"/>
  <text x="960" y="224" class="label">Router + Softmax</text>
  <text x="960" y="249" class="small">每个 token 得到 E 个分数</text>
  <path d="M960 266 V296" class="arrow"/>
  <rect x="810" y="298" width="300" height="70" class="box" fill="#fef3c7"/>
  <text x="960" y="326" class="label">Top-k 选择</text>
  <text x="960" y="351" class="small">每个 token 产生 k 个 assignments</text>
  <path d="M960 368 V395 H760 V420" class="arrow"/>
  <path d="M960 395 V420" class="arrow"/>
  <path d="M960 395 H1160 V420" class="arrow"/>
  <rect x="700" y="422" width="120" height="72" class="box" fill="#bbf7d0"/>
  <text x="760" y="464" class="label">专家 E1</text>
  <rect x="900" y="422" width="120" height="72" class="box" fill="#bbf7d0"/>
  <text x="960" y="464" class="label">专家 E2</text>
  <rect x="1100" y="422" width="120" height="72" class="box" fill="#e2e8f0"/>
  <text x="1160" y="464" class="label">… E_n</text>
  <path d="M760 494 V528 H960 V552" class="arrow"/>
  <path d="M960 494 V552" class="arrow"/>
  <path d="M1160 494 V528 H960" class="arrow"/>
  <rect x="790" y="554" width="340" height="76" class="box" fill="#e0f2fe"/>
  <text x="960" y="584" class="label">按 gate 权重合并输出</text>
  <text x="960" y="609" class="small">assignment counts = tokens × k</text>
  <rect x="790" y="650" width="340" height="58" class="box" fill="#fee2e2"/>
  <text x="960" y="675" class="small">新瓶颈：负载偏斜、dispatch、通信</text>
  <text x="960" y="697" class="small">总参数 ≠ 每 token 激活参数</text>
  <text x="640" y="790" class="small">原创教学示意图；非官方课件/论文原图。具体实现会因路由与 kernel 设计而异。</text>
</svg>